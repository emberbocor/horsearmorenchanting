modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/emberbocor/horsearmorenchanting/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/emberbocor/horsearmorenchanting"
authors="Ember Bocor"
displayTest="IGNORE_SERVER_VERSION"
description='''
Horse armor can be enchanted at the enchanting table and the anvil, and its armor enchantments work for the horse that wears it.
Only needed on the server: players without the mod can join.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
