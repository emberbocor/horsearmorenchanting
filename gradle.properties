org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: put classes and resources of the Forge module in one directory, required by Forge dev runs.
net.minecraftforge.gradle.merge-source-sets=true

minecraft_version=26.2
minecraft_version_range=[26.2]
minecraft_label=26.2
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2
neo_version=26.2.0.93
# The lowest NeoForge version the mod declares support for (the first NeoForge build for 26.2, a beta).
# Verify with: ./gradlew :neoforge:compileJava "-Pneo_version=26.2.0.0-beta"
neo_version_range=[26.2.0.0-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Fabric. The jar is compiled against minecraft_version and only supports Minecraft 26.2.
# Fabric API loads the mod's built-in data (item tags). The minimum Fabric API requires Fabric Loader 0.18.4 and Java 25.
# Verify with: ./gradlew :fabric:compileJava "-Pfabric_loader_version=0.18.4" "-Pfabric_api_version=0.152.1+26.2"
fabric_loader_version=0.20.1
fabric_loader_version_range=>=0.18.4
fabric_api_version=0.161.0+26.2
# Fabric ignores build metadata (+26.2) in version comparisons.
fabric_api_version_range=>=0.152.1
fabric_minecraft_version_range=26.2

# Forge. 26.2 uses the 65 series. Verify the minimum with: ./gradlew :forge:compileJava "-Pforge_version=65.0.0"
# forge_minecraft_version is separate so Fabric version checks do not change the Forge module.
forge_minecraft_version=26.2
forge_version=65.1.5
forge_version_range=[65.0.0,)
forge_loader_version_range=[65,)

mod_id=horsearmorenchanting
mod_name=Horse Armor Enchanting
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.horsearmorenchanting
